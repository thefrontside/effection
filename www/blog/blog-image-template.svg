  <!-- ======================================================= -->
  <!-- DIAGRAM PATTERN B: Flow arrows (pipeline / sequence)    -->
  <!-- Uncomment this block for before→after or step diagrams  -->
  <!-- ======================================================= -->
  <!--
  <g>
    <rect class="flow-box" x="680" y="280" width="120" height="80" rx="12" />
    <text x="710" y="326" class="mono">Step 1</text>
    <line class="flow-arrow" x1="800" y1="320" x2="840" y2="320"
      marker-end="url(#arrowhead)" />

name: www

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - v4

permissions:
  contents: read

env:
  # name of the netlify site, used to predict the url of a preview deploy
  NETLIFY_SITE_NAME: effection

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Preview
      # the alias deploy, so that this link shares an origin with the urls
      # baked into the build (see SITE_URL below)
      url: ${{ steps.netlify.outputs.stable-url }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.1

      - name: Compute Site URL
        id: site
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # an alias deploy lands on a predictable url, so a preview can point
          # at itself. a fork deploys anonymously to a url that is not known
          # until after the deploy, so it points at production instead.
          if [[ "$IS_FORK" == "true" ]]; then
            URL="https://${NETLIFY_SITE_NAME}.netlify.app"
          else
            URL="https://pr-${PR_NUMBER}--${NETLIFY_SITE_NAME}.netlify.app"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview will be served from $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Serve Website
        run: |
          deno run -A main.tsx &
          until curl --output /dev/null --silent --head --fail http://127.0.0.1:8000; do
            printf '.'
            sleep 1
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JSR_API: ${{ secrets.JSR_API }}
          # url embedded in resources that staticalize does not rewrite, such
          # as llms.txt
          SITE_URL: ${{ steps.site.outputs.url }}
        timeout-minutes: 5
        working-directory: ./www

      - name: Smoke test
        run: deno task smoke
        env:
          SMOKE_URL: http://127.0.0.1:8000
        timeout-minutes: 5
        working-directory: ./www

      - name: Download Staticalize
        run: |
          wget https://github.com/thefrontside/staticalize/releases/download/v0.2.6/staticalize-linux.tar.gz \
            -O /tmp/staticalize-linux.tar.gz
          tar -xzf /tmp/staticalize-linux.tar.gz -C /usr/local/bin
          chmod +x /usr/local/bin/staticalize-linux

      - name: Staticalize
        run: |
          staticalize-linux \
            --site=http://127.0.0.1:8000 \
            --output=www/built \
            --base=https://effection.netlify.app

      - name: Deploy Preview to Netlify
        id: netlify
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"

          if [[ "$IS_FORK" == "true" ]]; then
            DEPLOY_OUTPUT=$(npx netlify-cli deploy \
              --dir=www/built \
              --allow-anonymous \
              --message="Preview for PR #$PR_NUMBER at commit $COMMIT_SHA" \
              --json)

            UNIQUE_URL=$(echo "$DEPLOY_OUTPUT" | jq -er '.site_url')
            STABLE_URL="$UNIQUE_URL"
          else
            DEPLOY_OUTPUT=$(npx netlify-cli deploy \
              --dir=www/built \
              --alias="pr-$PR_NUMBER" \
              --message="Preview for PR #$PR_NUMBER at commit $COMMIT_SHA" \
              --auth="$NETLIFY_AUTH_TOKEN" \
              --site="$NETLIFY_SITE_ID" \
              --json)

            DEPLOY_ID=$(echo "$DEPLOY_OUTPUT" | jq -er '.deploy_id')
            SITE_NAME=$(echo "$DEPLOY_OUTPUT" | jq -er '.site_name')

            if [[ "$SITE_NAME" != "$NETLIFY_SITE_NAME" ]]; then
              echo "::warning::deployed to '$SITE_NAME' but urls were built for" \
                "'$NETLIFY_SITE_NAME'; update NETLIFY_SITE_NAME in this workflow"
            fi
            UNIQUE_URL="https://${DEPLOY_ID}--${SITE_NAME}.netlify.app"
            STABLE_URL="https://pr-${PR_NUMBER}--${SITE_NAME}.netlify.app"
          fi

          echo "unique-url=$UNIQUE_URL" >> "$GITHUB_OUTPUT"
          echo "stable-url=$STABLE_URL" >> "$GITHUB_OUTPUT"
          echo "### Netlify preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$UNIQUE_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with Preview Link
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: netlify-preview-deploy
          message: |
            🚀 **Deploy Preview Ready!**

            * **Stable Review Link:** ${{ steps.netlify.outputs.stable-url }}
            * **Latest Commit Snapshot:** ${{ steps.netlify.outputs.unique-url }}

  deploy-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      url: https://effection.netlify.app

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.1

      - name: Serve Website
        run: |
          deno run -A main.tsx &
          until curl --output /dev/null --silent --head --fail http://127.0.0.1:8000; do
            printf '.'
            sleep 1
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JSR_API: ${{ secrets.JSR_API }}
          # url embedded in resources that staticalize does not rewrite, such
          # as llms.txt
          SITE_URL: https://frontside.com/effection
        timeout-minutes: 5
        working-directory: ./www

      - name: Smoke test
        run: deno task smoke
        env:
          SMOKE_URL: http://127.0.0.1:8000
        timeout-minutes: 5
        working-directory: ./www

      - name: Download Staticalize
        run: |
          wget https://github.com/thefrontside/staticalize/releases/download/v0.2.6/staticalize-linux.tar.gz \
            -O /tmp/staticalize-linux.tar.gz
          tar -xzf /tmp/staticalize-linux.tar.gz -C /usr/local/bin
          chmod +x /usr/local/bin/staticalize-linux

      - name: Staticalize
        run: |
          staticalize-linux \
            --site=http://127.0.0.1:8000 \
            --output=www/built \
            --base=https://effection.netlify.app

      - name: Deploy to Production
        run: |
          npx netlify-cli deploy \
            --dir=www/built \
            --prod \
            --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} \
            --site=${{ secrets.NETLIFY_SITE_ID }}

  trigger-frontside-rebuild:
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wait for Netlify propagation
        run: sleep 60

      - name: Trigger frontside.com production rebuild
        env:
          GH_TOKEN: ${{ secrets.FRONTSIDEJACK_GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yaml \
            --repo thefrontside/frontside.com \
            --ref production

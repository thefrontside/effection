<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Structured Concurrency for JavaScript — Promises leak work out of bounds, Effection keeps everything inside the scope"
>
  <defs>
    <!-- Light-mode background gradient -->
    <linearGradient
      id="bg-light-grad"
      x1="0" y1="0" x2="1200" y2="630"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#F8FAFF" />
      <stop offset="0.55" stop-color="#F2F7FF" />
      <stop offset="1" stop-color="#ECF3FF" />
    </linearGradient>

    <!-- Light-mode decorative glow -->
    <radialGradient
      id="glow-light-grad"
      cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(900 120) rotate(120) scale(560 420)"
    >
      <stop offset="0" stop-color="#2B6FF7" stop-opacity="0.22" />
      <stop offset="0.55" stop-color="#2B6FF7" stop-opacity="0.07" />
      <stop offset="1" stop-color="#2B6FF7" stop-opacity="0" />
    </radialGradient>

    <!-- Dark-mode decorative glow -->
    <radialGradient
      id="glow-dark-grad"
      cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(900 120) rotate(120) scale(560 420)"
    >
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.10" />
      <stop offset="0.55" stop-color="#60A5FA" stop-opacity="0.03" />
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0" />
    </radialGradient>

    <!-- Light-mode title gradient -->
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A5B" />
      <stop offset="1" stop-color="#0C3A7A" />
    </linearGradient>

    <!-- Light-mode shadow (card) -->
    <filter
      id="softShadow-light"
      x="-40" y="-40" width="1280" height="710"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow dx="0" dy="10" stdDeviation="18"
        flood-color="#0B2A5B" flood-opacity="0.12" />
    </filter>

    <!-- Dark-mode shadow (card) -->
    <filter
      id="softShadow-dark"
      x="-40" y="-40" width="1280" height="710"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow dx="0" dy="10" stdDeviation="18"
        flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Light-mode shadow (inner) -->
    <filter
      id="tinyShadow-light"
      x="-40" y="-40" width="1280" height="710"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow dx="0" dy="5" stdDeviation="10"
        flood-color="#0B2A5B" flood-opacity="0.10" />
    </filter>

    <!-- Dark-mode shadow (inner) -->
    <filter
      id="tinyShadow-dark"
      x="-40" y="-40" width="1280" height="710"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow dx="0" dy="5" stdDeviation="10"
        flood-color="#000000" flood-opacity="0.20" />
    </filter>

    <style>
    /* ---- Font stacks ---- */
    .title {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI,
        Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI,
        Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .caption {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI,
        Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 18px;
      font-weight: 600;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      font-size: 14px;
    }
    .mono-sm {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
    }
    .label {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI,
        Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    /* ---- Light mode (default) ---- */
    .bg-light       { display: block; }
    .bg-dark        { display: none; }
    .glow-light     { display: block; }
    .glow-dark      { display: none; }
    .shadow-light   { display: block; }
    .shadow-dark    { display: none; }

    .grid           { opacity: 0.25; }
    .grid-line      { stroke: #C9D9F2; stroke-width: 1; }

    .card           { fill: #FFFFFF; }
    .divider        { stroke: #D6E4FF; stroke-dasharray: 4 4; stroke-width: 1; }

    /* Left side: Promises (broken) */
    .dashed-boundary { stroke: #B8CCF5; stroke-width: 2; stroke-dasharray: 8 4;
                       fill: none; }
    .dashed-label   { fill: #E6F0FF; }
    .leak-line      { stroke: #EA580C; stroke-width: 2; fill: none; }
    .leak-dot       { fill: #EA580C; }
    .leak-text      { fill: #EA580C; }
    .uncertain-text { fill: #EA580C; }

    /* Right side: Effection (structured) */
    .scope-parent   { fill: #F7FBFF; stroke: #97B7FF; stroke-width: 2; }
    .scope-label    { fill: #E6F0FF; }
    .scope-child    { fill: #FFFFFF; stroke: #2B6FF7; stroke-width: 2; }
    .scope-child-label { fill: #E8F4FF; }
    .dot-primary    { fill: #2B6FF7; }
    .dot-secondary  { fill: #0EA5E9; }
    .check-text     { fill: #16A34A; }

    /* Shared text */
    .title          { fill: url(#ink); }
    .subtitle       { fill: #33547B; }
    .caption        { fill: #23435F; }
    .mono           { fill: #1e3a8a; }
    .mono-sm        { fill: #1e3a8a; }
    .label          { fill: #33547B; }
    .label-heading  { fill: #0B2A5B; }

    /* ---- Dark mode ---- */
    @media (prefers-color-scheme: dark) {
      .bg-light       { display: none; }
      .bg-dark        { display: block; }
      .glow-light     { display: none; }
      .glow-dark      { display: block; }
      .shadow-light   { display: none; }
      .shadow-dark    { display: block; }

      .grid           { opacity: 0.20; }
      .grid-line      { stroke: #374151; }

      .card           { fill: #1F2937; }
      .divider        { stroke: #374151; }

      .dashed-boundary { stroke: #4B5563; }
      .dashed-label   { fill: #1E3A8A; }
      .leak-line      { stroke: #FB923C; }
      .leak-dot       { fill: #FB923C; }
      .leak-text      { fill: #FB923C; }
      .uncertain-text { fill: #FB923C; }

      .scope-parent   { fill: #111827; stroke: #374151; }
      .scope-label    { fill: #1E3A8A; }
      .scope-child    { fill: #1F2937; stroke: #60A5FA; }
      .scope-child-label { fill: #1E3A8A; }
      .dot-primary    { fill: #60A5FA; }
      .dot-secondary  { fill: #0EA5E9; }
      .check-text     { fill: #4ADE80; }

      .title          { fill: #F3F4F6; }
      .subtitle       { fill: #9CA3AF; }
      .caption        { fill: #D1D5DB; }
      .mono           { fill: #E5E7EB; }
      .mono-sm        { fill: #E5E7EB; }
      .label          { fill: #9CA3AF; }
      .label-heading  { fill: #F3F4F6; }
    }
    </style>
  </defs>

  <!-- ======== BACKGROUND ======== -->
  <rect class="bg-light" x="0" y="0" width="1200" height="630"
    fill="url(#bg-light-grad)" />
  <rect class="bg-dark" x="0" y="0" width="1200" height="630"
    fill="#111827" />
  <rect class="glow-light" x="0" y="0" width="1200" height="630"
    fill="url(#glow-light-grad)" />
  <rect class="glow-dark" x="0" y="0" width="1200" height="630"
    fill="url(#glow-dark-grad)" />

  <!-- ======== SUBTLE GRID ======== -->
  <g class="grid">
    <path class="grid-line" d="M90 90H1110" />
    <path class="grid-line" d="M90 150H1110" />
    <path class="grid-line" d="M90 210H1110" />
    <path class="grid-line" d="M90 270H1110" />
    <path class="grid-line" d="M90 330H1110" />
    <path class="grid-line" d="M90 390H1110" />
    <path class="grid-line" d="M90 450H1110" />
    <path class="grid-line" d="M90 510H1110" />
    <path class="grid-line" d="M90 570H1110" />
    <path class="grid-line" d="M120 80V580" />
    <path class="grid-line" d="M200 80V580" />
    <path class="grid-line" d="M280 80V580" />
    <path class="grid-line" d="M360 80V580" />
    <path class="grid-line" d="M440 80V580" />
    <path class="grid-line" d="M520 80V580" />
    <path class="grid-line" d="M600 80V580" />
    <path class="grid-line" d="M680 80V580" />
    <path class="grid-line" d="M760 80V580" />
    <path class="grid-line" d="M840 80V580" />
    <path class="grid-line" d="M920 80V580" />
    <path class="grid-line" d="M1000 80V580" />
    <path class="grid-line" d="M1080 80V580" />
  </g>

  <!-- ======== TITLE (left side) ======== -->
  <text x="90" y="140" class="subtitle">Effection Blog</text>
  <text x="90" y="205" class="title">Structured Concurrency</text>
  <text x="90" y="255" class="title">for JavaScript</text>
  <text x="90" y="305" class="caption"
  >Scope owns lifetime. Cleanup is guaranteed.</text>

  <!-- ======== DIAGRAM CARD ======== -->
  <g class="shadow-light" filter="url(#softShadow-light)">
    <rect class="card" x="480" y="120" width="640" height="430" rx="24" />
  </g>
  <g class="shadow-dark" filter="url(#softShadow-dark)">
    <rect class="card" x="480" y="120" width="640" height="430" rx="24" />
  </g>

  <!-- ======== DIVIDER ======== -->
  <line class="divider" x1="800" y1="148" x2="800" y2="522" />

  <!-- ======== LEFT SIDE: PROMISES ======== -->

  <!-- Section heading -->
  <text x="620" y="168" class="label label-heading" text-anchor="middle"
  >Promises</text>

  <!-- Dashed function boundary -->
  <rect class="dashed-boundary" x="520" y="186" width="240" height="210" rx="14" />

  <!-- Function label -->
  <rect class="dashed-label" x="534" y="198" width="100" height="24" rx="8" />
  <text x="546" y="215" class="mono-sm">async fn()</text>

  <!-- Items inside the function -->
  <text x="544" y="256" class="mono-sm">fetch()</text>
  <text x="544" y="296" class="mono-sm">setTimeout()</text>
  <text x="544" y="336" class="mono-sm">listen()</text>

  <!-- Leak lines: chaotic angles, escaping through the dashed boundary -->
  <!-- fetch → escapes upward-right -->
  <path class="leak-line" d="M620 250 C660 248 710 232 770 225"
    stroke-linecap="round" />
  <circle class="leak-dot" cx="770" cy="225" r="5" />

  <!-- setTimeout → escapes roughly horizontal, slight wobble -->
  <path class="leak-line" d="M650 290 C680 294 720 285 775 290"
    stroke-linecap="round" />
  <circle class="leak-dot" cx="775" cy="290" r="5" />

  <!-- listen → escapes downward-right -->
  <path class="leak-line" d="M620 330 C660 335 700 350 770 362"
    stroke-linecap="round" />
  <circle class="leak-dot" cx="770" cy="362" r="5" />

  <!-- Leaked effects text (below the box, warning color) -->
  <circle class="leak-dot" cx="534" cy="428" r="4" />
  <text x="546" y="432" class="mono-sm leak-text">still pending</text>
  <circle class="leak-dot" cx="534" cy="450" r="4" />
  <text x="546" y="454" class="mono-sm leak-text">still ticking</text>
  <circle class="leak-dot" cx="534" cy="472" r="4" />
  <text x="546" y="476" class="mono-sm leak-text">still bound</text>

  <!-- Punchline -->
  <text x="534" y="510" class="mono-sm uncertain-text">finally {} ?</text>

  <!-- ======== RIGHT SIDE: EFFECTION ======== -->

  <!-- Section heading -->
  <text x="980" y="168" class="label label-heading" text-anchor="middle"
  >Effection</text>

  <!-- Parent scope (solid boundary) -->
  <g class="shadow-light" filter="url(#tinyShadow-light)">
    <rect class="scope-parent" x="840" y="186" width="250" height="240" rx="14" />
    <rect class="scope-label" x="854" y="198" width="106" height="24" rx="8" />
    <text x="866" y="215" class="mono-sm">function*()</text>
  </g>
  <g class="shadow-dark" filter="url(#tinyShadow-dark)">
    <rect class="scope-parent" x="840" y="186" width="250" height="240" rx="14" />
    <rect class="scope-label" x="854" y="198" width="106" height="24" rx="8" />
    <text x="866" y="215" class="mono-sm">function*()</text>
  </g>

  <!-- Child scope (nested, solid) -->
  <rect class="scope-child" x="860" y="238" width="210" height="164" rx="12" />
  <rect class="scope-child-label" x="872" y="250" width="110" height="22" rx="8" />
  <text x="884" y="266" class="mono-sm">spawned task</text>

  <!-- Contained effects (inside child scope) -->
  <circle class="dot-primary" cx="884" cy="298" r="5" />
  <text x="898" y="302" class="mono-sm">fetch</text>

  <circle class="dot-primary" cx="884" cy="324" r="5" />
  <text x="898" y="328" class="mono-sm">timer</text>

  <circle class="dot-secondary" cx="884" cy="350" r="5" />
  <text x="898" y="354" class="mono-sm">listener</text>

  <!-- Scope ends indicator -->
  <text x="893" y="460" class="mono-sm label">scope ends</text>

  <!-- Down arrow -->
  <line x1="940" y1="430" x2="940" y2="468" class="divider"
    stroke-dasharray="none" stroke-width="2" />
  <path d="M934 462 L940 472 L946 462" class="divider"
    stroke-dasharray="none" stroke-width="2" fill="none" />

  <!-- Checkmarks -->
  <text x="870" y="500" class="mono-sm check-text">✓ halted + cleaned up</text>

  <!-- ======== BOTTOM TAGLINE (replaces legend) ======== -->
  <text x="90" y="560" class="mono caption"
  >Async should just feel normal.</text>
</svg>

    <rect class="stack-item" x="690" y="268" width="380" height="50" rx="12" />
    <circle class="stack-dot" cx="714" cy="293" r="6" />
    <text x="730" y="298" class="mono">Feature or item 2</text>

    <rect class="stack-item" x="690" y="336" width="380" height="50" rx="12" />
    <circle class="stack-dot" cx="714" cy="361" r="6" />
    <text x="730" y="366" class="mono">Feature or item 3</text>

    <rect class="stack-item" x="690" y="404" width="380" height="50" rx="12" />

    <text x="1030" y="326" class="mono">Step 3</text>
  </g>
  -->

  <!-- ======================================================= -->
  <!-- DIAGRAM PATTERN C: Stacked items (feature list)         -->
  <!-- Uncomment this block for vertical lists                 -->
  <!-- ======================================================= -->
  <!--
  <g>
    <rect class="stack-item" x="690" y="200" width="380" height="50" rx="12" />
    <circle class="stack-dot" cx="714" cy="225" r="6" />

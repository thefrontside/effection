<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Integrating Effection with libraries by bridging an external callback into an application scope"
>
  <defs>
    <linearGradient id="svg-bg-light-grad" x1="0" y1="0" x2="1200" y2="630"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFF" />
      <stop offset="0.55" stop-color="#F2F7FF" />
      <stop offset="1" stop-color="#ECF3FF" />
    </linearGradient>
    <radialGradient id="svg-glow-light-grad" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(900 120) rotate(120) scale(560 420)">
      <stop offset="0" stop-color="#2B6FF7" stop-opacity="0.22" />
      <stop offset="0.55" stop-color="#2B6FF7" stop-opacity="0.07" />
      <stop offset="1" stop-color="#2B6FF7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="svg-glow-dark-grad" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(900 120) rotate(120) scale(560 420)">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.10" />
      <stop offset="0.55" stop-color="#60A5FA" stop-opacity="0.03" />
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="svg-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A5B" />
      <stop offset="1" stop-color="#0C3A7A" />
    </linearGradient>
    <filter id="svg-soft-shadow-light" x="-40" y="-40" width="1280" height="710"
      filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0B2A5B"
        flood-opacity="0.12" />
    </filter>
    <filter id="svg-soft-shadow-dark" x="-40" y="-40" width="1280" height="710"
      filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000"
        flood-opacity="0.25" />
    </filter>
    <marker id="svg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8"
      markerHeight="8" orient="auto">
      <path class="svg-arrowhead" d="M 0 1 L 9 5 L 0 9 z" />
    </marker>
    <style>
    .svg-title,
    .svg-subtitle,
    .svg-caption,
    .svg-label {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
        Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    .svg-title {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .svg-subtitle {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .svg-caption {
      font-size: 18px;
      font-weight: 600;
    }
    .svg-label {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .svg-bg-light,
    .svg-glow-light,
    .svg-shadow-light {
      display: block;
    }
    .svg-bg-dark,
    .svg-glow-dark,
    .svg-shadow-dark {
      display: none;
    }
    .svg-grid {
      opacity: 0.25;
    }
    .svg-grid-line {
      stroke: #C9D9F2;
      stroke-width: 1;
    }
    .svg-card {
      fill: #FFFFFF;
    }
    .svg-title {
      fill: url(#svg-ink);
    }
    .svg-subtitle,
    .svg-label {
      fill: #33547B;
    }
    .svg-caption {
      fill: #23435F;
    }
    .svg-callback,
    .svg-scope {
      fill: #F7FBFF;
      stroke: #97B7FF;
      stroke-width: 2;
    }
    .svg-bridge {
      fill: #FFFFFF;
      stroke: #2B6FF7;
      stroke-width: 2;
    }
    .svg-operation {
      fill: #FFFFFF;
      stroke: #2B6FF7;
      stroke-width: 1.5;
    }
    .svg-child {
      fill: #E8F4FF;
      stroke: #97B7FF;
      stroke-width: 1.5;
    }
    .svg-arrow-line {
      fill: none;
      stroke: #97B7FF;
      stroke-width: 2.5;
    }
    .svg-arrowhead {
      fill: #97B7FF;
    }
    @media (prefers-color-scheme: dark) {
      .svg-bg-light,
      .svg-glow-light,
      .svg-shadow-light {
        display: none;
      }
      .svg-bg-dark,
      .svg-glow-dark,
      .svg-shadow-dark {
        display: block;
      }
      .svg-grid {
        opacity: 0.20;
      }
      .svg-grid-line {
        stroke: #374151;
      }
      .svg-card {
        fill: #1F2937;
      }
      .svg-title {
        fill: #F3F4F6;
      }
      .svg-subtitle,
      .svg-label {
        fill: #9CA3AF;
      }
      .svg-caption {
        fill: #D1D5DB;
      }
      .svg-callback,
      .svg-scope {
        fill: #111827;
        stroke: #374151;
      }
      .svg-bridge,
      .svg-operation {
        fill: #1F2937;
        stroke: #60A5FA;
      }
      .svg-child {
        fill: #1E3A5F;
        stroke: #60A5FA;
      }
      .svg-arrow-line {
        stroke: #60A5FA;
      }
      .svg-arrowhead {
        fill: #60A5FA;
      }
    }
    </style>
  </defs>

  <rect class="svg-bg-light" x="0" y="0" width="1200" height="630"
    fill="url(#svg-bg-light-grad)" />
  <rect class="svg-bg-dark" x="0" y="0" width="1200" height="630"
    fill="#111827" />
  <rect class="svg-glow-light" x="0" y="0" width="1200" height="630"
    fill="url(#svg-glow-light-grad)" />
  <rect class="svg-glow-dark" x="0" y="0" width="1200" height="630"
    fill="url(#svg-glow-dark-grad)" />

  <g class="svg-grid">
    <path class="svg-grid-line" d="M90 90H1110" />
    <path class="svg-grid-line" d="M90 150H1110" />
    <path class="svg-grid-line" d="M90 210H1110" />
    <path class="svg-grid-line" d="M90 270H1110" />
    <path class="svg-grid-line" d="M90 330H1110" />
    <path class="svg-grid-line" d="M90 390H1110" />
    <path class="svg-grid-line" d="M90 450H1110" />
    <path class="svg-grid-line" d="M90 510H1110" />
    <path class="svg-grid-line" d="M90 570H1110" />
    <path class="svg-grid-line" d="M120 80V580" />
    <path class="svg-grid-line" d="M200 80V580" />
    <path class="svg-grid-line" d="M280 80V580" />
    <path class="svg-grid-line" d="M360 80V580" />
    <path class="svg-grid-line" d="M440 80V580" />
    <path class="svg-grid-line" d="M520 80V580" />
    <path class="svg-grid-line" d="M600 80V580" />
    <path class="svg-grid-line" d="M680 80V580" />
    <path class="svg-grid-line" d="M760 80V580" />
    <path class="svg-grid-line" d="M840 80V580" />
    <path class="svg-grid-line" d="M920 80V580" />
    <path class="svg-grid-line" d="M1000 80V580" />
    <path class="svg-grid-line" d="M1080 80V580" />
  </g>

  <text x="90" y="140" class="svg-subtitle">Effection Blog</text>
  <text x="90" y="205" class="svg-title">Integrating</text>
  <text x="90" y="255" class="svg-title">Effection with</text>
  <text x="90" y="305" class="svg-title">Libraries</text>
  <text x="90" y="355" class="svg-caption">Bring non-Effection code into</text>
  <text x="90" y="378"
    class="svg-caption">a structured application scope.</text>

  <g class="svg-shadow-light" filter="url(#svg-soft-shadow-light)">
    <rect class="svg-card" x="540" y="80" width="580" height="470" rx="24" />
  </g>
  <g class="svg-shadow-dark" filter="url(#svg-soft-shadow-dark)">
    <rect class="svg-card" x="540" y="80" width="580" height="470" rx="24" />
  </g>

  <rect class="svg-callback" x="630" y="125" width="400" height="68" rx="16" />
  <text class="svg-label" x="830" y="165"
    text-anchor="middle">External callback</text>
  <path class="svg-arrow-line" d="M830 194V232" marker-end="url(#svg-arrow)" />

  <rect class="svg-bridge" x="630" y="244" width="400" height="68" rx="16" />
  <text class="svg-label" x="830" y="284"
    text-anchor="middle">Scope bridge</text>
  <path class="svg-arrow-line" d="M830 313V351" marker-end="url(#svg-arrow)" />

  <rect class="svg-scope" x="600" y="363" width="460" height="142" rx="18" />
  <text class="svg-label" x="624" y="391">Application scope</text>
  <rect class="svg-operation" x="630" y="410" width="210" height="62" rx="14" />
  <text class="svg-label" x="735" y="447" text-anchor="middle">operation</text>
  <rect class="svg-child" x="862" y="410" width="168" height="62" rx="14" />
  <text class="svg-label" x="946" y="447" text-anchor="middle">children</text>
</svg>

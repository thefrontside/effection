<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Strict Structured Concurrency — foreground tasks express the algorithm, background tasks are automatically reclaimed when the scope exits"
>
  <defs>
    <!-- Light-mode background gradient -->
    <linearGradient
      id="bg-light-grad"
      x1="0"
      y1="0"
      x2="1200"
      y2="630"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#F8FAFF" />
      <stop offset="0.55" stop-color="#F2F7FF" />
      <stop offset="1" stop-color="#ECF3FF" />
    </linearGradient>

    <!-- Light-mode decorative glow -->
    <radialGradient
      id="glow-light-grad"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(900 120) rotate(120) scale(560 420)"
    >
      <stop offset="0" stop-color="#2B6FF7" stop-opacity="0.22" />
      <stop offset="0.55" stop-color="#2B6FF7" stop-opacity="0.07" />
      <stop offset="1" stop-color="#2B6FF7" stop-opacity="0" />
    </radialGradient>

    <!-- Dark-mode decorative glow -->
    <radialGradient
      id="glow-dark-grad"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(900 120) rotate(120) scale(560 420)"
    >
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.10" />
      <stop offset="0.55" stop-color="#60A5FA" stop-opacity="0.03" />
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0" />
    </radialGradient>

    <!-- Light-mode title gradient -->
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A5B" />
      <stop offset="1" stop-color="#0C3A7A" />
    </linearGradient>

    <!-- Light-mode shadow (card) -->
    <filter
      id="softShadow-light"
      x="-40"
      y="-40"
      width="1280"
      height="710"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="18"
        flood-color="#0B2A5B"
        flood-opacity="0.12"
      />
    </filter>

    <!-- Dark-mode shadow (card) -->
    <filter
      id="softShadow-dark"
      x="-40"
      y="-40"
      width="1280"
      height="710"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="18"
        flood-color="#000000"
        flood-opacity="0.25"
      />
    </filter>

    <!-- Light-mode shadow (inner) -->
    <filter
      id="tinyShadow-light"
      x="-40"
      y="-40"
      width="1280"
      height="710"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow
        dx="0"
        dy="5"
        stdDeviation="10"
        flood-color="#0B2A5B"
        flood-opacity="0.10"
      />
    </filter>

    <!-- Dark-mode shadow (inner) -->
    <filter
      id="tinyShadow-dark"
      x="-40"
      y="-40"
      width="1280"
      height="710"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow
        dx="0"
        dy="5"
        stdDeviation="10"
        flood-color="#000000"
        flood-opacity="0.20"
      />
    </filter>

    <style>
    /* ---- Font stacks ---- */
    .svg-title {
      font-family:
        ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
        Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .svg-subtitle {
      font-family:
        ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
        Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .svg-caption {
      font-family:
        ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
        Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 18px;
      font-weight: 600;
    }
    .svg-mono {
      font-family:
        ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      font-size: 14px;
    }
    .svg-mono-sm {
      font-family:
        ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
    }
    .svg-label {
      font-family:
        ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
        Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    /* ---- Light mode (default) ---- */
    .svg-bg-light {
      display: block;
    }
    .svg-bg-dark {
      display: none;
    }
    .svg-glow-light {
      display: block;
    }
    .svg-glow-dark {
      display: none;
    }
    .svg-shadow-light {
      display: block;
    }
    .svg-shadow-dark {
      display: none;
    }

    .svg-grid {
      opacity: 0.25;
    }
    .svg-grid-line {
      stroke: #c9d9f2;
      stroke-width: 1;
    }

    .svg-card {
      fill: #ffffff;
    }
    .svg-divider {
      stroke: #d6e4ff;
      stroke-dasharray: 4 4;
      stroke-width: 1;
    }

    /* Foreground side */
    .svg-fg-box {
      fill: #ffffff;
      stroke: #2b6ff7;
      stroke-width: 2;
    }
    .svg-fg-dot {
      fill: #2b6ff7;
    }
    .svg-fg-label {
      fill: #2b6ff7;
    }

    /* Background side */
    .svg-bg-box {
      fill: #ffffff;
      stroke: #9ca3af;
      stroke-width: 1.5;
      stroke-dasharray: 6 3;
    }
    .svg-bg-dot {
      fill: #9ca3af;
    }
    .svg-bg-label {
      fill: #6b7280;
    }
    .svg-bg-fade {
      fill: #9ca3af;
      opacity: 0.4;
    }

    /* Scope */
    .svg-scope-parent {
      fill: #f7fbff;
      stroke: #97b7ff;
      stroke-width: 2;
    }
    .svg-scope-label {
      fill: #e6f0ff;
    }
    .svg-dot-primary {
      fill: #2b6ff7;
    }
    .svg-check-text {
      fill: #16a34a;
      stroke: #16a34a;
    }
    .svg-cancel-text {
      fill: #9ca3af;
    }
    .svg-arrow-line {
      stroke: #97b7ff;
      fill: none;
    }

    /* Shared text */
    .svg-title {
      fill: url(#ink);
    }
    .svg-subtitle {
      fill: #33547b;
    }
    .svg-caption {
      fill: #23435f;
    }
    .svg-mono {
      fill: #1e3a8a;
    }
    .svg-mono-sm {
      fill: #1e3a8a;
    }
    .svg-label {
      fill: #33547b;
    }
    .svg-label-heading {
      fill: #0b2a5b;
    }

    /* ---- Dark mode ---- */
    @media (prefers-color-scheme: dark) {
      .svg-bg-light {
        display: none;
      }
      .svg-bg-dark {
        display: block;
      }
      .svg-glow-light {
        display: none;
      }
      .svg-glow-dark {
        display: block;
      }
      .svg-shadow-light {
        display: none;
      }
      .svg-shadow-dark {
        display: block;
      }

      .svg-grid {
        opacity: 0.20;
      }
      .svg-grid-line {
        stroke: #374151;
      }

      .svg-card {
        fill: #1f2937;
      }
      .svg-divider {
        stroke: #374151;
      }

      .svg-fg-box {
        fill: #1f2937;
        stroke: #60a5fa;
      }
      .svg-fg-dot {
        fill: #60a5fa;
      }
      .svg-fg-label {
        fill: #60a5fa;
      }

      .svg-bg-box {
        fill: #1f2937;
        stroke: #6b7280;
      }
      .svg-bg-dot {
        fill: #6b7280;
      }
      .svg-bg-label {
        fill: #9ca3af;
      }
      .svg-bg-fade {
        fill: #6b7280;
        opacity: 0.4;
      }

      .svg-scope-parent {
        fill: #111827;
        stroke: #374151;
      }
      .svg-scope-label {
        fill: #1e3a8a;
      }
      .svg-dot-primary {
        fill: #60a5fa;
      }
      .svg-check-text {
        fill: #4ade80;
        stroke: #4ade80;
      }
      .svg-cancel-text {
        fill: #6b7280;
      }
      .svg-arrow-line {
        stroke: #60a5fa;
      }

      .svg-title {
        fill: #f3f4f6;
      }
      .svg-subtitle {
        fill: #9ca3af;
      }
      .svg-caption {
        fill: #d1d5db;
      }
      .svg-mono {
        fill: #e5e7eb;
      }
      .svg-mono-sm {
        fill: #e5e7eb;
      }
      .svg-label {
        fill: #9ca3af;
      }
      .svg-label-heading {
        fill: #f3f4f6;
      }
    }
    </style>
  </defs>

  <!-- ======== BACKGROUND ======== -->
  <rect
    class="svg-bg-light"
    x="0"
    y="0"
    width="1200"
    height="630"
    fill="url(#bg-light-grad)"
  />
  <rect
    class="svg-bg-dark"
    x="0"
    y="0"
    width="1200"
    height="630"
    fill="#111827"
  />
  <rect
    class="svg-glow-light"
    x="0"
    y="0"
    width="1200"
    height="630"
    fill="url(#glow-light-grad)"
  />
  <rect
    class="svg-glow-dark"
    x="0"
    y="0"
    width="1200"
    height="630"
    fill="url(#glow-dark-grad)"
  />

  <!-- ======== SUBTLE GRID ======== -->
  <g class="svg-grid">
    <path class="svg-grid-line" d="M90 90H1110" />
    <path class="svg-grid-line" d="M90 150H1110" />
    <path class="svg-grid-line" d="M90 210H1110" />
    <path class="svg-grid-line" d="M90 270H1110" />
    <path class="svg-grid-line" d="M90 330H1110" />
    <path class="svg-grid-line" d="M90 390H1110" />
    <path class="svg-grid-line" d="M90 450H1110" />
    <path class="svg-grid-line" d="M90 510H1110" />
    <path class="svg-grid-line" d="M90 570H1110" />
    <path class="svg-grid-line" d="M120 80V580" />
    <path class="svg-grid-line" d="M200 80V580" />
    <path class="svg-grid-line" d="M280 80V580" />
    <path class="svg-grid-line" d="M360 80V580" />
    <path class="svg-grid-line" d="M440 80V580" />
    <path class="svg-grid-line" d="M520 80V580" />
    <path class="svg-grid-line" d="M600 80V580" />
    <path class="svg-grid-line" d="M680 80V580" />
    <path class="svg-grid-line" d="M760 80V580" />
    <path class="svg-grid-line" d="M840 80V580" />
    <path class="svg-grid-line" d="M920 80V580" />
    <path class="svg-grid-line" d="M1000 80V580" />
    <path class="svg-grid-line" d="M1080 80V580" />
  </g>

  <!-- ======== DIAGRAM CARD ======== -->
  <g class="svg-shadow-light" filter="url(#softShadow-light)">
    <rect class="svg-card" x="90" y="40" width="1020" height="550" rx="24" />
  </g>
  <g class="svg-shadow-dark" filter="url(#softShadow-dark)">
    <rect class="svg-card" x="90" y="40" width="1020" height="550" rx="24" />
  </g>

  <!-- ======== SCOPE BOUNDARY ======== -->
  <g class="svg-shadow-light" filter="url(#tinyShadow-light)">
    <rect
      class="svg-scope-parent"
      x="120"
      y="70"
      width="960"
      height="420"
      rx="16"
    />
  </g>
  <g class="svg-shadow-dark" filter="url(#tinyShadow-dark)">
    <rect
      class="svg-scope-parent"
      x="120"
      y="70"
      width="960"
      height="420"
      rx="16"
    />
  </g>
  <rect class="svg-scope-label" x="140" y="82" width="72" height="24" rx="8" />
  <text x="152" y="99" class="svg-mono-sm">scope</text>

  <!-- ======== DIVIDER ======== -->
  <line class="svg-divider" x1="600" y1="120" x2="600" y2="470" />

  <!-- ======== LEFT: FOREGROUND ======== -->
  <text x="370" y="140" class="svg-label svg-label-heading" text-anchor="middle"
  >Foreground</text>

  <rect class="svg-fg-box" x="200" y="168" width="340" height="48" rx="10" />
  <circle class="svg-fg-dot" cx="224" cy="192" r="6" />

  <rect class="svg-fg-box" x="220" y="232" width="300" height="44" rx="10" />
  <circle class="svg-fg-dot" cx="244" cy="254" r="6" />

  <rect class="svg-fg-box" x="220" y="290" width="300" height="44" rx="10" />
  <circle class="svg-fg-dot" cx="244" cy="312" r="6" />

  <!-- Check mark -->
  <text x="220" y="416" class="svg-mono svg-check-text" stroke="none"
  >&#x2713; values consumed</text>

  <!-- ======== RIGHT: BACKGROUND ======== -->
  <text x="830" y="140" class="svg-label svg-label-heading" text-anchor="middle"
  >Background</text>

  <rect class="svg-bg-box" x="680" y="168" width="300" height="48" rx="10" />
  <circle class="svg-bg-dot" cx="704" cy="192" r="6" />

  <rect class="svg-bg-box" x="680" y="232" width="300" height="48" rx="10" />
  <circle class="svg-bg-dot" cx="704" cy="256" r="6" />

  <rect class="svg-bg-box" x="680" y="296" width="300" height="48" rx="10" />
  <circle class="svg-bg-dot" cx="704" cy="320" r="6" />

  <!-- Fading out indication -->
  <text x="720" y="386" class="svg-mono svg-cancel-text">scope exits</text>

  <!-- Down arrow -->
  <line
    x1="790"
    y1="396"
    x2="790"
    y2="428"
    stroke-width="2"
    class="svg-arrow-line"
  />
  <path
    d="M784 422 L790 432 L796 422"
    stroke-width="2"
    class="svg-arrow-line"
  />

  <text x="720" y="460" class="svg-mono svg-cancel-text"
  >&#x2717; automatically halted</text>
</svg>

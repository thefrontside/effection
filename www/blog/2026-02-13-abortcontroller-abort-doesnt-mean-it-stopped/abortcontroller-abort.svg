<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="AbortController.abort() Doesn't Mean It Stopped — Two terminal windows comparing AbortController (continues running after abort) vs Effection (cleanup is automatic when scope exits)."
>
  <defs>
    <!-- Light-mode background gradient -->
    <linearGradient
      id="bg-light-grad"
      x1="0"
      y1="0"
      x2="1200"
      y2="630"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#F8FAFF" />
      <stop offset="0.55" stop-color="#F2F7FF" />
      <stop offset="1" stop-color="#ECF3FF" />
    </linearGradient>

    <!-- Light-mode decorative glow -->
    <radialGradient
      id="glow-light-grad"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(600 315) rotate(90) scale(400 600)"
    >
      <stop offset="0" stop-color="#2B6FF7" stop-opacity="0.12" />
      <stop offset="0.55" stop-color="#2B6FF7" stop-opacity="0.04" />
      <stop offset="1" stop-color="#2B6FF7" stop-opacity="0" />
    </radialGradient>

    <!-- Dark-mode decorative glow -->
    <radialGradient
      id="glow-dark-grad"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(600 315) rotate(90) scale(400 600)"
    >
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.08" />
      <stop offset="0.55" stop-color="#60A5FA" stop-opacity="0.02" />
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0" />
    </radialGradient>

    <!-- Light-mode title gradient -->
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A5B" />
      <stop offset="1" stop-color="#0C3A7A" />
    </linearGradient>

    <!-- Terminal shadows -->
    <filter
      id="terminalShadow-light"
      x="-40"
      y="-40"
      width="1280"
      height="710"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="16"
        flood-color="#0B2A5B"
        flood-opacity="0.15"
      />
    </filter>

    <filter
      id="terminalShadow-dark"
      x="-40"
      y="-40"
      width="1280"
      height="710"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="16"
        flood-color="#000000"
        flood-opacity="0.4"
      />
    </filter>

    <style>
    /* ---- Font stacks ---- */
    .svg-title {
      font-family:
        ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
        Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .svg-title-mono {
      font-family:
        ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .svg-subtitle {
      font-family:
        ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
        Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .svg-caption {
      font-family:
        ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
        Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 16px;
      font-weight: 700;
    }
    .svg-terminal-title {
      font-family:
        ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
        Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 13px;
      font-weight: 600;
    }
    .svg-mono {
      font-family:
        ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.4;
    }
    .svg-mono-sm {
      font-family:
        ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
    }

    /* ---- Light mode (default) ---- */
    .svg-bg-light {
      display: block;
    }
    .svg-bg-dark {
      display: none;
    }
    .svg-glow-light {
      display: block;
    }
    .svg-glow-dark {
      display: none;
    }
    .svg-shadow-light {
      display: block;
    }
    .svg-shadow-dark {
      display: none;
    }

    /* Terminal chrome */
    .svg-terminal-frame {
      fill: #1e1e1e;
    }
    .svg-terminal-header-left {
      fill: #3c2a2a;
    }
    .svg-terminal-header-right {
      fill: #2a3c2e;
    }
    .svg-terminal-body {
      fill: #0d1117;
    }
    .svg-terminal-title {
      fill: #9ca3af;
    }
    .svg-terminal-dot-red {
      fill: #ff5f56;
    }
    .svg-terminal-dot-yellow {
      fill: #ffbd2e;
    }
    .svg-terminal-dot-green {
      fill: #27c93f;
    }

    /* Terminal text */
    .svg-terminal-text {
      fill: #e6edf3;
    }
    .svg-terminal-dim {
      fill: #7d8590;
    }
    .svg-terminal-warn {
      fill: #f97316;
    }
    .svg-terminal-success {
      fill: #22c55e;
    }
    .svg-terminal-info {
      fill: #60a5fa;
    }

    /* Title and captions */
    .svg-title {
      fill: url(#ink);
    }
    .svg-title-mono {
      fill: url(#ink);
    }
    .svg-subtitle {
      fill: #33547b;
    }
    .svg-caption-fail {
      fill: #dc2626;
    }
    .svg-caption-success {
      fill: #16a34a;
    }

    /* ---- Dark mode ---- */
    @media (prefers-color-scheme: dark) {
      .svg-bg-light {
        display: none;
      }
      .svg-bg-dark {
        display: block;
      }
      .svg-glow-light {
        display: none;
      }
      .svg-glow-dark {
        display: block;
      }
      .svg-shadow-light {
        display: none;
      }
      .svg-shadow-dark {
        display: block;
      }

      .svg-terminal-frame {
        fill: #161b22;
      }
      .svg-terminal-header-left {
        fill: #2d2226;
      }
      .svg-terminal-header-right {
        fill: #1e2d24;
      }
      .svg-terminal-body {
        fill: #0d1117;
      }

      .svg-title {
        fill: #f3f4f6;
      }
      .svg-title-mono {
        fill: #f3f4f6;
      }
      .svg-subtitle {
        fill: #9ca3af;
      }
      .svg-caption-fail {
        fill: #f87171;
      }
      .svg-caption-success {
        fill: #4ade80;
      }
    }
    </style>
  </defs>

  <!-- ======== BACKGROUND ======== -->
  <rect
    class="svg-bg-light"
    x="0"
    y="0"
    width="1200"
    height="630"
    fill="url(#bg-light-grad)"
  />
  <rect
    class="svg-bg-dark"
    x="0"
    y="0"
    width="1200"
    height="630"
    fill="#111827"
  />
  <rect
    class="svg-glow-light"
    x="0"
    y="0"
    width="1200"
    height="630"
    fill="url(#glow-light-grad)"
  />
  <rect
    class="svg-glow-dark"
    x="0"
    y="0"
    width="1200"
    height="630"
    fill="url(#glow-dark-grad)"
  />

  <!-- ======== TITLE (full width, top) ======== -->
  <text x="60" y="52" class="svg-subtitle">Effection Blog</text>
  <text y="100" class="svg-title">
    <tspan x="60" class="svg-title-mono">AbortController.abort()</tspan>
    <tspan class="svg-title"> Doesn't Mean It Stopped</tspan>
  </text>

  <!-- ======== LEFT TERMINAL: AbortController ======== -->
  <g class="svg-shadow-light" filter="url(#terminalShadow-light)">
    <g>
      <!-- Terminal frame -->
      <rect
        class="svg-terminal-frame"
        x="60"
        y="140"
        width="520"
        height="430"
        rx="12"
      />
      <!-- Header bar with red tint -->
      <rect
        class="svg-terminal-header-left"
        x="60"
        y="140"
        width="520"
        height="36"
        rx="12"
      />
      <rect class="svg-terminal-body" x="60" y="164" width="520" height="12" />
      <!-- Window dots -->
      <circle class="svg-terminal-dot-red" cx="84" cy="158" r="6" />
      <circle class="svg-terminal-dot-yellow" cx="104" cy="158" r="6" />
      <circle class="svg-terminal-dot-green" cx="124" cy="158" r="6" />
      <!-- Title -->
      <text
        x="355"
        y="158"
        dy="0.35em"
        class="svg-terminal-title"
        text-anchor="middle"
      >AbortController</text>
      <!-- Body -->
      <rect class="svg-terminal-body" x="60" y="176" width="520" height="394" />
    </g>
  </g>
  <g class="svg-shadow-dark" filter="url(#terminalShadow-dark)">
    <g>
      <rect
        class="svg-terminal-frame"
        x="60"
        y="140"
        width="520"
        height="430"
        rx="12"
      />
      <rect
        class="svg-terminal-header-left"
        x="60"
        y="140"
        width="520"
        height="36"
        rx="12"
      />
      <rect class="svg-terminal-body" x="60" y="164" width="520" height="12" />
      <circle class="svg-terminal-dot-red" cx="84" cy="158" r="6" />
      <circle class="svg-terminal-dot-yellow" cx="104" cy="158" r="6" />
      <circle class="svg-terminal-dot-green" cx="124" cy="158" r="6" />
      <text
        x="355"
        y="158"
        dy="0.35em"
        class="svg-terminal-title"
        text-anchor="middle"
      >AbortController</text>
      <rect class="svg-terminal-body" x="60" y="176" width="520" height="394" />
    </g>
  </g>

  <!-- Left terminal content -->
  <g class="svg-mono">
    <text x="80" y="206" class="svg-terminal-text">tick: STILL RUNNING</text>
    <text x="80" y="226" class="svg-terminal-text">tick: STILL RUNNING</text>
    <text x="80" y="246" class="svg-terminal-text">tick: STILL RUNNING</text>
    <text x="80" y="276" class="svg-terminal-dim">>>> calling abort()</text>
    <text x="80" y="296" class="svg-terminal-dim">>>> abort() returned</text>
    <text x="80" y="326" class="svg-terminal-info"
    >task ended with: aborted</text>
    <text x="80" y="356" class="svg-terminal-dim"
    >>> caller thinks it's done</text>
    <text x="80" y="396" class="svg-terminal-warn">tick: STILL RUNNING</text>
    <text x="80" y="416" class="svg-terminal-warn">tick: STILL RUNNING</text>
    <text x="80" y="436" class="svg-terminal-warn">tick: STILL RUNNING</text>
    <text x="80" y="456" class="svg-terminal-warn">tick: STILL RUNNING</text>
    <text x="80" y="476" class="svg-terminal-warn">tick: STILL RUNNING</text>
    <text x="80" y="496" class="svg-terminal-dim">...</text>
  </g>

  <!-- Left caption -->
  <text
    x="320"
    y="602"
    class="svg-caption svg-caption-fail"
    text-anchor="middle"
  >keeps running</text>

  <!-- ======== RIGHT TERMINAL: Effection ======== -->
  <g class="svg-shadow-light" filter="url(#terminalShadow-light)">
    <g>
      <!-- Terminal frame -->
      <rect
        class="svg-terminal-frame"
        x="620"
        y="140"
        width="520"
        height="430"
        rx="12"
      />
      <!-- Header bar with green tint -->
      <rect
        class="svg-terminal-header-right"
        x="620"
        y="140"
        width="520"
        height="36"
        rx="12"
      />
      <rect class="svg-terminal-body" x="620" y="164" width="520" height="12" />
      <!-- Window dots -->
      <circle class="svg-terminal-dot-red" cx="644" cy="158" r="6" />
      <circle class="svg-terminal-dot-yellow" cx="664" cy="158" r="6" />
      <circle class="svg-terminal-dot-green" cx="684" cy="158" r="6" />
      <!-- Title -->
      <text
        x="915"
        y="158"
        dy="0.35em"
        class="svg-terminal-title"
        text-anchor="middle"
      >Structured Concurrency</text>
      <!-- Body -->
      <rect
        class="svg-terminal-body"
        x="620"
        y="176"
        width="520"
        height="394"
      />
    </g>
  </g>
  <g class="svg-shadow-dark" filter="url(#terminalShadow-dark)">
    <g>
      <rect
        class="svg-terminal-frame"
        x="620"
        y="140"
        width="520"
        height="430"
        rx="12"
      />
      <rect
        class="svg-terminal-header-right"
        x="620"
        y="140"
        width="520"
        height="36"
        rx="12"
      />
      <rect class="svg-terminal-body" x="620" y="164" width="520" height="12" />
      <circle class="svg-terminal-dot-red" cx="644" cy="158" r="6" />
      <circle class="svg-terminal-dot-yellow" cx="664" cy="158" r="6" />
      <circle class="svg-terminal-dot-green" cx="684" cy="158" r="6" />
      <text
        x="915"
        y="158"
        dy="0.35em"
        class="svg-terminal-title"
        text-anchor="middle"
      >Structured Concurrency</text>
      <rect
        class="svg-terminal-body"
        x="620"
        y="176"
        width="520"
        height="394"
      />
    </g>
  </g>

  <!-- Right terminal content -->
  <g class="svg-mono">
    <text x="640" y="206" class="svg-terminal-text">tick: RUNNING</text>
    <text x="640" y="226" class="svg-terminal-text">tick: RUNNING</text>
    <text x="640" y="246" class="svg-terminal-text">tick: RUNNING</text>
    <text x="640" y="276" class="svg-terminal-dim">>>> leaving scope</text>
    <text x="640" y="296" class="svg-terminal-dim">>>> scope exited</text>
    <text x="640" y="346" class="svg-terminal-success"
    >all children stopped</text>
  </g>

  <!-- Right caption -->
  <text
    x="880"
    y="602"
    class="svg-caption svg-caption-success"
    text-anchor="middle"
  >cleanup is automatic</text>
</svg>

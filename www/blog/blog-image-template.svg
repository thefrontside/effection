  <!-- ======== LEGEND (bottom) ======== -->
  <!-- CUSTOMIZE: Replace legend items -->
  <g opacity="0.92">
    <rect class="legend" x="90" y="505" width="640" height="92" rx="18" />
    <circle class="dot-primary" cx="120" cy="540" r="8" />
    <text x="140" y="545" class="mono">Legend item 1 description</text>
    <circle class="dot-muted" cx="120" cy="572" r="8" />
    <text x="140" y="577" class="mono">Legend item 2 description</text>
  </g>
</svg>

  <text x="534" y="510" class="svg-mono-sm svg-uncertain-text">finally {} ?</text>
  <rect class="svg-scope-parent" x="840" y="186" width="250" height="240" rx="14" />
  <text x="870" y="500" class="svg-mono-sm svg-check-text">✓ cleaned up</text>
  -->

  <!-- ======== LEGEND (bottom) ======== -->
  <!-- CUSTOMIZE: Replace legend items -->
  <g opacity="0.92">
    <rect class="svg-legend" x="90" y="505" width="640" height="92" rx="18" />
    <circle class="svg-dot-primary" cx="120" cy="540" r="8" />
    <text x="140" y="545" class="svg-mono">Legend item 1 description</text>
    <circle class="svg-dot-muted" cx="120" cy="572" r="8" />
    <text x="140" y="577" class="svg-mono">Legend item 2 description</text>
  </g>
</svg>

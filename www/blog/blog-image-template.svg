  <!-- DIAGRAM PATTERN D: Before/after (broken vs structured)  -->
  <!-- Use a wider card (x=480, w=640) and add a divider       -->
  <!-- Uncomment this block for comparison diagrams             -->
  <!-- ======================================================= -->

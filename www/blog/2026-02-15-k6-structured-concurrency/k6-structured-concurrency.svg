<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Diagram comparing async/await (tags lost before callback) vs structured concurrency (tags preserved through async)"
>
  <defs>
    <!-- Light-mode background gradient -->
    <linearGradient
      id="bg-light-grad"
      x1="0"
      y1="0"
      x2="1200"
      y2="630"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#F8FAFF" />
      <stop offset="0.55" stop-color="#F2F7FF" />
      <stop offset="1" stop-color="#ECF3FF" />
    </linearGradient>

    <!-- Dark-mode background -->
    <linearGradient
      id="bg-dark-grad"
      x1="0"
      y1="0"
      x2="1200"
      y2="630"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>

    <!-- Light-mode title gradient -->
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A5B" />
      <stop offset="1" stop-color="#0C3A7A" />
    </linearGradient>

    <!-- Card shadows -->
    <filter
      id="cardShadow-light"
      x="-20"
      y="-20"
      width="640"
      height="500"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="12"
        flood-color="#0B2A5B"
        flood-opacity="0.10"
      />
    </filter>

    <filter
      id="cardShadow-dark"
      x="-20"
      y="-20"
      width="640"
      height="500"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="12"
        flood-color="#000000"
        flood-opacity="0.30"
      />
    </filter>

    <style>
    /* ---- Font stacks ---- */
    .svg-title {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .svg-subtitle {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .svg-section-title {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
    }
    .svg-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      font-weight: 500;
    }
    .svg-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
    }
    .svg-comment {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
      font-style: italic;
    }

    /* ---- Light mode (default) ---- */
    .svg-bg-light { display: block; }
    .svg-bg-dark { display: none; }
    .svg-shadow-light { display: block; }
    .svg-shadow-dark { display: none; }

    .svg-card { fill: #ffffff; }
    .svg-card-stroke { stroke: #e2e8f0; stroke-width: 1; }

    .svg-title { fill: url(#ink); }
    .svg-subtitle { fill: #64748b; }
    .svg-section-title-bad { fill: #dc2626; }
    .svg-section-title-good { fill: #16a34a; }

    .svg-step-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .svg-step-box-active { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
    .svg-step-box-bad { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2; }

    .svg-mono { fill: #334155; }
    .svg-comment { fill: #94a3b8; }
    .svg-comment-bad { fill: #f87171; }

    .svg-tag-good { fill: #16a34a; }
    .svg-tag-bad { fill: #dc2626; }
    .svg-tag-bg-good { fill: #dcfce7; stroke: #86efac; stroke-width: 1; }
    .svg-tag-bg-bad { fill: #fee2e2; stroke: #fca5a5; stroke-width: 1; }
    .svg-tag-bg-empty { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4 2; }

    .svg-arrow { stroke: #94a3b8; stroke-width: 2; fill: none; }
    .svg-arrow-head { fill: #94a3b8; }

    .svg-divider { stroke: #e2e8f0; stroke-width: 2; stroke-dasharray: 8 4; }

    /* ---- Dark mode ---- */
    @media (prefers-color-scheme: dark) {
      .svg-bg-light { display: none; }
      .svg-bg-dark { display: block; }
      .svg-shadow-light { display: none; }
      .svg-shadow-dark { display: block; }

      .svg-card { fill: #1e293b; }
      .svg-card-stroke { stroke: #334155; }

      .svg-title { fill: #f1f5f9; }
      .svg-subtitle { fill: #94a3b8; }
      .svg-section-title-bad { fill: #f87171; }
      .svg-section-title-good { fill: #4ade80; }

      .svg-step-box { fill: #0f172a; stroke: #334155; }
      .svg-step-box-active { fill: #1e3a5f; stroke: #3b82f6; }
      .svg-step-box-bad { fill: #3f1d1d; stroke: #f87171; }

      .svg-mono { fill: #e2e8f0; }
      .svg-comment { fill: #64748b; }
      .svg-comment-bad { fill: #f87171; }

      .svg-tag-good { fill: #4ade80; }
      .svg-tag-bad { fill: #f87171; }
      .svg-tag-bg-good { fill: #14532d; stroke: #22c55e; }
      .svg-tag-bg-bad { fill: #450a0a; stroke: #f87171; }
      .svg-tag-bg-empty { fill: #1e293b; stroke: #475569; }

      .svg-arrow { stroke: #64748b; }
      .svg-arrow-head { fill: #64748b; }

      .svg-divider { stroke: #334155; }
    }

    /* ---- Animation keyframes (10s cycle) ---- */
    /* Left side: async/await broken flow */
    @keyframes step-L1 {
      0%, 4% { opacity: 0; }
      5%, 80% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }
    @keyframes step-L2 {
      0%, 14% { opacity: 0; }
      15%, 80% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }
    @keyframes step-L3 {
      0%, 24% { opacity: 0; }
      25%, 80% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }
    @keyframes step-L4 {
      0%, 34% { opacity: 0; }
      35%, 80% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }
    @keyframes step-L5 {
      0%, 44% { opacity: 0; }
      45%, 80% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }

    /* Tag state for left side: present at start, gone by step 4 */
    @keyframes tag-L-good {
      0%, 4% { opacity: 0; }
      5%, 34% { opacity: 1; }
      35%, 100% { opacity: 0; }
    }
    @keyframes tag-L-bad {
      0%, 34% { opacity: 0; }
      35%, 80% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }

    /* Right side: structured concurrency working flow */
    @keyframes step-R1 {
      0%, 4% { opacity: 0; }
      5%, 80% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }
    @keyframes step-R2 {
      0%, 14% { opacity: 0; }
      15%, 80% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }
    @keyframes step-R3 {
      0%, 24% { opacity: 0; }
      25%, 80% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }
    @keyframes step-R4 {
      0%, 44% { opacity: 0; }
      45%, 80% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }
    @keyframes step-R5 {
      0%, 54% { opacity: 0; }
      55%, 80% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }

    /* Tag state for right side: present through step 4, then cleared */
    @keyframes tag-R-good {
      0%, 4% { opacity: 0; }
      5%, 54% { opacity: 1; }
      55%, 100% { opacity: 0; }
    }
    @keyframes tag-R-cleared {
      0%, 54% { opacity: 0; }
      55%, 80% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }

    /* Apply animations */
    .anim-L1 { opacity: 0; animation: step-L1 10s ease infinite; }
    .anim-L2 { opacity: 0; animation: step-L2 10s ease infinite; }
    .anim-L3 { opacity: 0; animation: step-L3 10s ease infinite; }
    .anim-L4 { opacity: 0; animation: step-L4 10s ease infinite; }
    .anim-L5 { opacity: 0; animation: step-L5 10s ease infinite; }
    .anim-tag-L-good { opacity: 0; animation: tag-L-good 10s ease infinite; }
    .anim-tag-L-bad { opacity: 0; animation: tag-L-bad 10s ease infinite; }

    .anim-R1 { opacity: 0; animation: step-R1 10s ease infinite; }
    .anim-R2 { opacity: 0; animation: step-R2 10s ease infinite; }
    .anim-R3 { opacity: 0; animation: step-R3 10s ease infinite; }
    .anim-R4 { opacity: 0; animation: step-R4 10s ease infinite; }
    .anim-R5 { opacity: 0; animation: step-R5 10s ease infinite; }
    .anim-tag-R-good { opacity: 0; animation: tag-R-good 10s ease infinite; }
    .anim-tag-R-cleared { opacity: 0; animation: tag-R-cleared 10s ease infinite; }

    /* Accessibility: respect reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      .anim-L1, .anim-L2, .anim-L3, .anim-L4, .anim-L5,
      .anim-R1, .anim-R2, .anim-R3, .anim-R4, .anim-R5,
      .anim-tag-L-good, .anim-tag-L-bad,
      .anim-tag-R-good, .anim-tag-R-cleared {
        opacity: 1;
        animation: none;
      }
    }
    </style>
  </defs>

  <!-- ======== BACKGROUND ======== -->
  <rect class="svg-bg-light" x="0" y="0" width="1200" height="630" fill="url(#bg-light-grad)" />
  <rect class="svg-bg-dark" x="0" y="0" width="1200" height="630" fill="url(#bg-dark-grad)" />

  <!-- ======== HEADER ======== -->
  <text x="600" y="45" class="svg-subtitle" text-anchor="middle">Effection Blog</text>
  <text x="600" y="95" class="svg-title" text-anchor="middle">Missing Guarantees in k6's JS Runtime</text>

  <!-- ======== CENTER DIVIDER ======== -->
  <line class="svg-divider" x1="600" y1="130" x2="600" y2="600" />

  <!-- ======== LEFT CARD: Async/Await (broken) ======== -->
  <g class="svg-shadow-light" filter="url(#cardShadow-light)">
    <rect class="svg-card svg-card-stroke" x="40" y="140" width="520" height="450" rx="16" />
  </g>
  <g class="svg-shadow-dark" filter="url(#cardShadow-dark)">
    <rect class="svg-card svg-card-stroke" x="40" y="140" width="520" height="450" rx="16" />
  </g>

  <!-- Left title -->
  <text x="300" y="175" class="svg-section-title svg-section-title-bad" text-anchor="middle">Async/Await</text>

  <!-- Left tag state indicator (positioned on right side of card) -->
  <g class="anim-tag-L-good">
    <rect class="svg-tag-bg-good" x="440" y="158" width="100" height="22" rx="4" />
    <text x="490" y="173" class="svg-tag svg-tag-good" text-anchor="middle">group: coolgroup</text>
  </g>
  <g class="anim-tag-L-bad">
    <rect class="svg-tag-bg-empty" x="440" y="158" width="100" height="22" rx="4" />
    <text x="490" y="173" class="svg-tag svg-tag-bad" text-anchor="middle">group: —</text>
  </g>

  <!-- Left steps -->
  <!-- Step 1: c.add(1) -->
  <g class="anim-L1">
    <rect class="svg-step-box-active" x="60" y="200" width="480" height="44" rx="8" />
    <text x="80" y="228" class="svg-mono">c.add(1)</text>
    <text x="520" y="228" class="svg-comment" text-anchor="end">tagged ✓</text>
  </g>

  <!-- Step 2: async call -->
  <g class="anim-L2">
    <rect class="svg-step-box-active" x="60" y="254" width="480" height="44" rx="8" />
    <text x="80" y="282" class="svg-mono">http.asyncRequest("GET", url)</text>
  </g>

  <!-- Step 3: state saved (comment) -->
  <g class="anim-L3">
    <rect class="svg-step-box" x="60" y="308" width="480" height="44" rx="8" />
    <text x="300" y="336" class="svg-comment" text-anchor="middle">// group() saves current tags</text>
  </g>

  <!-- Step 4: group cleared - THE KEY MOMENT -->
  <g class="anim-L4">
    <rect class="svg-step-box-bad" x="60" y="362" width="480" height="44" rx="8" />
    <text x="300" y="390" class="svg-comment svg-comment-bad" text-anchor="middle">// group() exits, tags cleared</text>
  </g>

  <!-- Step 5: .then() runs but tag is gone -->
  <g class="anim-L5">
    <rect class="svg-step-box-bad" x="60" y="416" width="480" height="44" rx="8" />
    <text x="80" y="444" class="svg-mono">.then(() => c.add(1))</text>
    <text x="520" y="444" class="svg-comment svg-comment-bad" text-anchor="end">tag already gone ✗</text>
  </g>

  <!-- Left timeline arrow -->
  <line class="svg-arrow" x1="300" y1="480" x2="300" y2="560" />
  <polygon class="svg-arrow-head" points="300,565 295,555 305,555" />
  <text x="300" y="585" class="svg-comment" text-anchor="middle">execution order</text>

  <!-- ======== RIGHT CARD: Structured Concurrency (works) ======== -->
  <g class="svg-shadow-light" filter="url(#cardShadow-light)">
    <rect class="svg-card svg-card-stroke" x="640" y="140" width="520" height="450" rx="16" />
  </g>
  <g class="svg-shadow-dark" filter="url(#cardShadow-dark)">
    <rect class="svg-card svg-card-stroke" x="640" y="140" width="520" height="450" rx="16" />
  </g>

  <!-- Right title -->
  <text x="900" y="175" class="svg-section-title svg-section-title-good" text-anchor="middle">Structured Concurrency</text>

  <!-- Right tag state indicator -->
  <g class="anim-tag-R-good">
    <rect class="svg-tag-bg-good" x="1040" y="158" width="100" height="22" rx="4" />
    <text x="1090" y="173" class="svg-tag svg-tag-good" text-anchor="middle">group: coolgroup</text>
  </g>
  <g class="anim-tag-R-cleared">
    <rect class="svg-tag-bg-empty" x="1040" y="158" width="100" height="22" rx="4" />
    <text x="1090" y="173" class="svg-tag" text-anchor="middle" style="fill: #64748b;">group: —</text>
  </g>

  <!-- Right steps -->
  <!-- Step 1: c.add(1) -->
  <g class="anim-R1">
    <rect class="svg-step-box-active" x="660" y="200" width="480" height="44" rx="8" />
    <text x="680" y="228" class="svg-mono">c.add(1)</text>
    <text x="1120" y="228" class="svg-comment" text-anchor="end">tagged ✓</text>
  </g>

  <!-- Step 2: async call -->
  <g class="anim-R2">
    <rect class="svg-step-box-active" x="660" y="254" width="480" height="44" rx="8" />
    <text x="680" y="282" class="svg-mono">yield* until(http.asyncRequest(...))</text>
  </g>

  <!-- Step 3: async completes, still in scope -->
  <g class="anim-R3">
    <rect class="svg-step-box-active" x="660" y="308" width="480" height="44" rx="8" />
    <text x="680" y="336" class="svg-mono">c.add(1)</text>
    <text x="1120" y="336" class="svg-comment" text-anchor="end">still tagged ✓</text>
  </g>

  <!-- Step 4: scope saves value -->
  <g class="anim-R4">
    <rect class="svg-step-box" x="660" y="362" width="480" height="44" rx="8" />
    <text x="900" y="390" class="svg-comment" text-anchor="middle">// scope owns async, waits for completion</text>
  </g>

  <!-- Step 5: scope cleared AFTER async done -->
  <g class="anim-R5">
    <rect class="svg-step-box" x="660" y="416" width="480" height="44" rx="8" />
    <text x="900" y="444" class="svg-comment" text-anchor="middle">// scope exits, tags cleared</text>
  </g>

  <!-- Right timeline arrow -->
  <line class="svg-arrow" x1="900" y1="480" x2="900" y2="560" />
  <polygon class="svg-arrow-head" points="900,565 895,555 905,555" />
  <text x="900" y="585" class="svg-comment" text-anchor="middle">execution order</text>

</svg>

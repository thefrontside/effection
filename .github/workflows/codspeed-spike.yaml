name: CodSpeed Spike (Node)

on:
  workflow_dispatch:
  push:
    branches: [codspeed-spike]

permissions:
  contents: read
  id-token: write

jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: build effection npm package
        run: |
          deno task build:npm 0.0.0-bench
          cd build/npm
          npm pack
          mv *.tgz ../../effection.tgz

      - name: install bench-node deps
        working-directory: bench-node
        run: |
          npm install ../effection.tgz
          npm install

      - name: run spike under CodSpeed
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: node --experimental-strip-types bench-node/spike.bench.ts
